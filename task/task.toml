[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Data Processing and ETL"                      # diversity category, assigned to your task by the Dynamo team
subcategory = "Media data processing"                   # diversity subcategory, assigned by the Dynamo team
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"           # difficulty-benchmarking model (do not change)
agent_tested = "Terminus-2"        # difficulty-benchmarking agent (do not change)
# --- You fill these in ---
task_objective = ["fix", "implement"]
artifact_type = ["single_script_or_program"]
expert_time_estimate_hours = 4
difficulty_explanation = """
The audience is a media-pipeline engineer maintaining the tooling that decides what a container actually
plays: the code that turns a track's samples and its edit list into a presentation timeline. Getting it
wrong is expensive in both directions — a resolver that ignores a gap reports every later sample early, so
a mux built on it drifts audio against video for the rest of the programme, and one that presents media an
edit trims away puts frames on screen the container says should never be shown. The streams and the
published pairs here are synthetic, generated by `tests/_trusted/corpus.py` rather than pulled from real
containers, but they are shaped like real ones: gaps expressed as empty edits, edit lists that present the
media out of order, windows that cut a sample list in the middle, tracks on different timescales, and
conversions that land exactly on a half millisecond.

The rules are all written down, and they interact through the presentation clock. That clock is advanced by
every edit, including the ones that present nothing, so a single misread of what an empty edit does moves
every sample after it — and because the summary counts what survived, and a stream holding an empty edit
carries a seal over those counts, one wrong reading costs the sample lines, the summary and the seal
together.

Two of those rules are not exercised anywhere the agent can see. `python3 /app/selfcheck.py` reports five of
five before a line is changed and keeps reporting it, because no worked stream holds an empty edit and no
worked stream trims a sample away. SPEC.md states which rules the worked streams leave untouched, so this
is disclosed rather than hidden, but a run that audits itself against the self-check learns nothing about
the two that decide most of the graded streams.

The empty edit is the subtle one. It is not an entry to skip: skipping it and advancing the clock only for
edits that present something gives exactly the right answer on every stream that has no gap, which is
precisely what the worked streams are, and shifts every sample after the gap on the ones that do. The
half-open window is the same shape of trap from the other side — a sample starting exactly where an edit
ends belongs to the next edit, or to nothing at all.

The seal fold is written down: one XOR–multiply–modulo step per byte with three constants fixed for every
stream. `data/SEALS.txt` publishes 90 exact pairs that pin those constants, structured as eight families of
nine whose texts part only in their closing byte. Recovering the numbers takes algebra rather than lookup,
and no graded stream's canonical text appears in that file. Zero-duration samples stack several indices on
the same media start; the worked streams never exercise that shape, so a resolver that only replays the
self-check still learns nothing about coincident indices.
"""
solution_explanation = """
Read SPEC.md and audit the shipped resolver against it rather than against the self-check, which is green on
arrival and stays green through every repair.

The shipped version predates the current contract. It builds each track's media timeline correctly and
converts to milliseconds correctly — including the half-to-even rounding — and then ignores the edit list
altogether, reporting every sample at its media time and never dropping one. That is right for a stream
whose edits present the whole timeline unchanged, which is what all five worked streams are.

What has to be added is the presentation clock. Walk the edit list in order carrying a clock that starts at
0; every edit advances it by its own duration. An edit with a negative start presents nothing and only moves
the clock — that is a gap. Any other edit presents the half-open media window beginning at its start, and a
sample whose media start falls in that window is reported at the clock as the edit began, plus the distance
from the edit's start to the sample's. The first edit covering a sample keeps it; a sample no edit covers is
dropped and reported with a `-`.

And the seal is not emitted at all, so every stream holding an empty edit has a summary line one field
short.

The reference loads the three seal constants from `/app/data/SEALS.txt` at import time using the fold named
in SPEC.md — cross-multiplying family differences cancels the multiplier and leaves a multiple of the
modulus; agreement between families gives the modulus, the multiplier follows by modular inverse once the
register's low bits are pinned, and the starting register falls out of a backward walk. `solution/recover_seal.py`
is the same recovery written as a standalone checker for reviewers.
"""
verification_explanation = """
Grading is deterministic and all-or-nothing over 5 worked streams plus 46 fixed graded ones, each compared
exactly and in order against a trusted resolver in `tests/_trusted/model.py`. Nothing is sampled, nothing is
random, and no tolerance is applied anywhere — every reported time is an exact integer millisecond, so a
listing either equals the trusted one line for line or that stream fails.

The trusted resolver is written independently of the reference rather than derived from it — it asks, for
each sample in turn, which edit presents it, where the reference walks the edit list once and claims the
samples each edit covers. Agreement between them means the rules agree, not that one is a copy of the other.
That agreement was checked while building the task over the whole corpus and over 4000 randomly generated
streams; the shipped verifier grades the 51 fixed streams, which is what the reward is computed from.

The submission runs once, in an unprivileged child as `nobody` with an empty `PYTHONPATH` and a working
directory outside `/app`, and writes a single plain-text transcript in which each stream's answer is framed
by its own label. The streams are staged under neutral names in a shuffled order, so nothing the child
receives says which stream it is answering. Parsing one transcript rather than trusting an exit status means
a stream the submission raises on is recorded as that stream's failure and the remaining fifty are still
judged. The trusted corpus is locked to 0700 and an unprivileged probe asserts it is unreadable; the
shipped spec, published pairs and self-check are SHA-pinned so a run is never graded against its own edit of
them; and containment is checked as four named claims collected together, so a linked parent directory or a
path resolving outside `/app` is named as the specific bypass it is.
"""

